---
- name:
  hosts:
    - game-k3s-managers
  run_once: true
  tags:
    - server
  environment:
    KUBECONFIG: "{{ kube_config_path }}"
  become: true
  vars:
    network_address: "10.0.206.100"
    instance: "goon-squad"
    itzg_tag: "java21"
    namespace: "games"
    version: "v1.21.11"
    min_cpu: 1
    max_cpu: 4
    min_ram: "2G"
    max_ram: "8G"
    world_size: "20Gi"
    etc_size: "5Gi"
    backup_size: "10Gi"
    save_size: "5Gi"
    mods_size: "5Gi"
    server_stats: "forge"
    svc_port: 25565
    ops_json:
      [
        {
          "uuid": "f0992df2-357c-403c-9d4c-b73da406aabb",
          "name": "queen_of_wands",
          "level": 4,
          "bypassesPlayerLimit": true,
        },
        {
          "uuid": "43576037-51ad-4c44-83ff-c741500d8e1e",
          "name": "Mylf_Hunter69420",
          "level": 4,
        },
      ]
    envConfigMap:
      apiVersion: v1
      kind: ConfigMap
      metadata:
        name: "{{ instance }}-env-{{ version }}"
        namespace: "{{ namespace }}"
      data:
        EULA: "true"
        LOG_TIMESTAMP: "true"
        ENABLE_AUTO_RESTART: "false"
        VERSION: "1.21.11"
        TYPE: "VANILLA"
        # SEED: ""
        SPAWN_PROTECTION: "0"
        VIEW_DISTANCE: "32"
        ALLOW_FLIGHT: "TRUE"
        MOTD: "{{ instance }} {{ version }}"
        # RCON_CMDS_STARTUP: |
        #  gamerule doInsomnia false
        #  gamerule doFireTick false
        INIT_MEMORY: "{{ min_ram }}"
        MAX_MEMORY: "{{ max_ram }}"
        # CF_SLUG: ""
        # CF_FILE_ID: ""
        # CF_BASE_DIR: "/data"
        # CF_SERVER_MOD: ""
        JVM_XX_OPTS: "-XX:+UseZGC -XX:+ParallelRefProcEnabled -XX:+UseStringDeduplication -XX:ParallelGCThreads={{ (min_cpu | int * 2) | round(0, 'ceil') | int }} -XX:+UnlockExperimentalVMOptions -XX:+DisableExplicitGC -XX:+AlwaysPreTouch -XX:+PerfDisableSharedMem"
        USE_AIKAR_FLAGS: "FALSE"
  roles:
    - deploy
