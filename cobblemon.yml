---
- name:
  hosts:
    - game-k3s-managers
  run_once: true
  tags:
    - server
  environment:
    KUBECONFIG: "{{ kube_config_path }}"
  become: true
  vars:
    network_address: "10.0.206.102"
    instance: "cobblemon"
    itzg_tag: "java21"
    namespace: "games"
    version: "v1.6.1"
    min_cpu: 1
    max_cpu: 4
    min_ram: "10G"
    max_ram: "20G"
    world_size: "20Gi"
    etc_size: "5Gi"
    backup_size: "10Gi"
    backups_dir: "backups"
    save_size: "5Gi"
    mods_size: "5Gi"
    server_stats: "fabric"
    svc_port: 25565
    ops_json:
      [
        {
          "uuid": "f0992df2-357c-403c-9d4c-b73da406aabb",
          "name": "queen_of_wands",
          "level": 4,
          "bypassesPlayerLimit": true,
        },
      ]
    envConfigMap:
      apiVersion: v1
      kind: ConfigMap
      metadata:
        name: "{{ instance }}-env-{{ version }}"
        namespace: "{{ namespace }}"
      data:
        EULA: "true"
        LOG_TIMESTAMP: "true"
        ENABLE_AUTO_RESTART: "false"
        # VERSION: "1.21.1"
        TYPE: "CURSEFORGE"
        # SEED: ""
        SPAWN_PROTECTION: "0"
        ALLOW_FLIGHT: "TRUE"
        MOTD: "{{ instance }} {{ version }}"
        # RCON_CMDS_STARTUP: |
        #  gamerule doInsomnia false
        #  gamerule doFireTick false
        INIT_MEMORY: "{{ min_ram }}"
        MAX_MEMORY: "{{ max_ram }}"
        PROXY: "{{ internet_proxy }}"
        ENABLE_COMMAND_BLOCK: "true"
        # CF_SLUG: "cobbleverse-cobblemon"
        # CF_FILE_ID: "7107446"
        CF_BASE_DIR: "/data"
        CF_MODPACK_ZIP: "https://mediafilez.forgecdn.net/files/7107/446/COBBLEVERSE-1.6-CF.zip"
        # CF_SERVER_MOD: ""
        JVM_XX_OPTS: "-XX:+UseZGC -XX:+ParallelRefProcEnabled -XX:+UseStringDeduplication -XX:ParallelGCThreads={{ (min_cpu | int * 2) | round(0, 'ceil') | int }} -XX:+UnlockExperimentalVMOptions -XX:+DisableExplicitGC -XX:+AlwaysPreTouch -XX:+PerfDisableSharedMem"
        USE_AIKAR_FLAGS: "FALSE"
  roles:
    - deploy
